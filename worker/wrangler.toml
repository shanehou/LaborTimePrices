name = "ltp-prices"
main = "index.js"
compatibility_date = "2026-11-13"

# GET https://ltp.melkor.me/api/* is served by this Worker. The rest of the
# hostname stays on the Cloudflare Pages project.
routes = [
  { pattern = "ltp.melkor.me/api/*", zone_name = "melkor.me" }
]

# Numbeo responses and rate-limit counters are cached here. Create the real
# namespace once and replace the placeholder id with the printed one:
#   npx wrangler kv namespace create CITY_CACHE
[[kv_namespaces]]
binding = "CITY_CACHE"
id = "00000000000000000000000000000000"
