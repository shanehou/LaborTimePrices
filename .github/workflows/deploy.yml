name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm test

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Test worker
        working-directory: worker
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      # The token is only exposed to the two deploy steps, not to tests/build.
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 188e19eb359c61d63ccbcfda11240018
        run: npx --yes wrangler@4.162.0 deploy

      - name: Deploy Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 188e19eb359c61d63ccbcfda11240018
        run: >-
          npx --yes wrangler@4.162.0 pages deploy dist
          --project-name ltp
          --branch main
          --commit-hash "${{ github.sha }}"
